name: Review lab tests
on:
  pull_request:
  push:
    branches: [feature/B-test]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run task service tests
        working-directory: review-lab
        run: python -m unittest discover -s tests -v
